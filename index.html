<script>
var DATA = {"exams": [{"id": "e1", "title": "Exam 1", "sub": "Foundations of business communication", "topics": "Professionalism, the communication process, teams, ethics, culture, the three-step writing process, style, email", "sets": [{"name": "Set A", "desc": "Concepts and definitions", "qs": [["Which definition of professionalism matches your study guide?", ["Avoiding every disagreement with coworkers, managers, and customers", "Working more hours each week than the rest of your team does", "Wearing formal business attire and keeping a neat, organized desk every day", "Performing at a high level and conducting yourself with purpose and pride"], 3, "Professionalism is about the quality of your performance and conduct, not clothing, hours, or avoiding conflict."], ["Communication is best described as:", ["An exchange of meaning between a sender and a receiver", "Speaking clearly enough that everyone can hear you", "The act of choosing the best channel for a message", "The one-way delivery of information to an audience"], 0, "Communication is an exchange of meaning, not just transmission of words."], ["As you move up the corporate ladder, the amount of communication you do generally:", ["Increases, because you inform and persuade more people", "Decreases, because others handle most of the details", "Stays about the same at every level of the company", "Shifts almost entirely from speaking to writing"], 0, "Higher-level roles bring more meetings, more audiences, and more responsibility for messages."], ["Why is the transactional model favored over a one-way (linear) model?", ["It applies only to conversations held in person at the office", "It assumes the receiver always understands what the sender meant", "Sender and receiver both send and receive, so feedback shapes the message", "It removes the need to pick a medium, since feedback replaces it entirely"], 2, "In the transactional model both people are senders and receivers at the same time."], ["Which sequence matches the basic communication process in your class notes?", ["Words, idea, received, medium", "Idea, medium, received, words", "Medium, idea, words, received", "Idea, words, medium, received"], 3, "The sender has an idea, puts it into words, chooses a medium, and the receiver gets it."], ["Which channel is generally the richest, because it carries the most cues?", ["A text message to a coworker", "A mass email to the department", "Face-to-face conversation", "A printed memo on the bulletin board"], 2, "Physical presence adds tone, gestures, and instant feedback, which makes face-to-face the richest channel."], ["In communication, what is noise?", ["The words the sender chooses to express the idea", "Only loud sounds in the room where the message is delivered", "Anything that interferes with the message being sent or received", "The feedback a receiver gives back to the sender"], 2, "Noise can be physical (a loud room), technical (a bad connection), or psychological (stress or distraction)."], ["What does a sender do when encoding a message?", ["Puts the idea into words, images, or other symbols", "Responds to the receiver with a follow-up question", "Chooses the channel that will carry the message", "Interprets the meaning of the message received"], 0, "Encoding turns the idea into symbols. Decoding is the receiver's interpretation of those symbols."], ["Which of these is feedback in the communication process?", ["The sender's original idea, before it is put into words or symbols", "A receiver's response that shows how the message was understood", "The channel the sender chose to carry the message to the receiver", "Background noise that distorts or blocks the message in transit"], 1, "Feedback lets the sender see whether the message arrived and was understood as intended."], ["Judging other cultures by the standards of your own culture is called:", ["Empathy", "Stereotyping", "Ethnocentrism", "Acculturation"], 2, "Ethnocentrism treats your own culture as the standard. Stereotyping assigns group traits to individuals."], ["What is stereotyping?", ["Adapting your message to the needs of one specific reader", "Assigning generalized traits to a person based on group membership", "Judging another culture by the standards of your own culture", "Learning the customs of another culture before you visit it"], 1, "Stereotypes replace the individual with assumptions about a group."], ["Why does communicating across cultures take extra care?", ["Every culture expects the same level of formality and directness", "Only the vocabulary changes, while customs stay exactly the same", "Cultures can differ in directness, formality, time, and nonverbal cues", "Nonverbal cues carry the same meaning in every country and culture"], 2, "Different expectations can cause misunderstandings even when the language is shared."], ["Which statement best describes digital information fluency?", ["Finding, judging, and ethically using digital information", "Posting on social media networks several times every single day", "Typing quickly and knowing the keyboard shortcuts in most software", "Memorizing every menu and toolbar option in your office software"], 0, "It includes recognizing an information need, finding reliable sources, and using what you find ethically."], ["Choosing between two options when the right choice is unclear is an:", ["Ethical bias", "Ethical audit", "Ethical lapse", "Ethical dilemma"], 3, "A dilemma is a hard choice between competing options. A lapse is a clearly unethical or illegal choice."], ["A person knowingly makes a clearly unethical choice. This is an:", ["Honest mistake", "Cultural misunderstanding", "Ethical dilemma", "Ethical lapse"], 3, "A lapse is a deliberate unethical or illegal act, unlike a dilemma where the right answer is unclear."], ["Ethical business communication is best described as:", ["Including all relevant information and being truthful in every way", "Saying only what protects the company from public criticism or blame", "Leaving out details that might upset or confuse the audience", "Using persuasive language to win the audience over at any cost"], 0, "Ethical messages are honest, complete, and not deceptive."], ["A team is arguing over roles and competing for influence. Which stage is it in?", ["Storming", "Forming", "Norming", "Performing"], 0, "The stages are forming, storming, norming, performing, and adjourning. Storming is where conflict appears."], ["In which stage do team members get acquainted and learn what is expected?", ["Storming", "Adjourning", "Norming", "Forming"], 3, "Forming is the first stage, when members are polite and still sorting out the basics."], ["Which stage is marked by resolved conflict and agreed-on roles and rules?", ["Performing", "Storming", "Norming", "Forming"], 2, "In norming the team settles roles, rules, and ways of working together."], ["What is groupthink?", ["A disagreement that arises when members have different goals and roles", "Pressure for agreement that overrides a realistic look at the alternatives", "A brainstorming method that helps a team produce many ideas quickly", "A way of dividing a large writing project among team members"], 1, "Groupthink discourages dissent and often leads to poor decisions."], ["What is a hidden agenda on a team?", ["A meeting agenda that the leader never sent to the team members", "A confidential list of the company's long-term strategic goals", "A private goal that may conflict with the team's goals", "A schedule that shows the tasks assigned to each team member"], 2, "Hidden agendas undermine trust because the member's real motives are not shared."], ["Which is a key benefit of a diverse team?", ["A wider range of ideas, experiences, and perspectives", "Faster decisions, since the members all think in similar ways", "No need for any conflict management or team ground rules", "Less need for communication among the team members"], 0, "Diverse teams often solve problems more creatively, though they may need more effort to communicate."], ["Which describes constructive conflict on a team?", ["Disagreement focused on issues that leads to better solutions", "Personal arguments that settle who has the most power", "Complaints shared outside the team instead of inside it", "Silence from members who disagree with the plan"], 0, "Constructive conflict stays on the issue. Destructive conflict turns personal."], ["Which type of listening aims to understand the speaker's feelings?", ["Empathic listening", "Content listening", "Passive listening", "Critical listening"], 0, "Content listening is for facts, critical listening is for evaluating, and empathic listening is for feelings."], ["Which of these is an example of nonverbal communication?", ["A written summary sent after the call", "Eye contact, posture, and tone of voice", "A spoken greeting at the start of a meeting", "A slide with a bulleted list of key points"], 1, "Nonverbal cues carry meaning without words and can support or contradict what is said."], ["What is the most useful step before a meeting?", ["Book the longest time slot that the calendar will allow", "Define the purpose and send an agenda to the participants", "Invite as many people as possible so no one is left out", "Wait to see which topics people raise once the meeting begins"], 1, "A clear purpose and agenda keep the meeting focused and respect everyone's time."], ["In the three-step writing process, analyzing the situation belongs to which step?", ["Completing", "Writing", "Distributing", "Planning"], 3, "Planning covers analyzing the situation, gathering information, selecting the medium, and organizing. Check your notes for your instructor's wording."], ["Which activities belong to the completing step?", ["Choosing the medium and outlining the main points of the message", "Revising, producing, proofreading, and distributing the message", "Analyzing the audience and gathering the needed information", "Drafting the first version and organizing the main ideas"], 1, "Completing is the finishing stage that gets the message ready and delivers it."], ["Under the usual guideline, how should your time be split among planning, writing, and completing?", ["About 50% planning, 25% writing, and 25% completing", "About 25% planning, 50% writing, and 25% completing", "About 40% planning, 30% writing, and 30% completing", "About 25% planning, 25% writing, and 50% completing"], 0, "Planning gets the largest share. Some textbooks use slightly different numbers, so confirm with your own materials."], ["Which of these is NOT a general purpose of a business message?", ["To conceal", "To inform", "To persuade", "To facilitate interaction"], 0, "The general purposes are to inform, persuade, motivate, and facilitate interaction."], ["What is the specific purpose of a message?", ["The general category that the message falls into, such as inform", "What you want the audience to know, believe, or do after reading it", "The medium you will use to deliver the message to the audience", "The length you expect the finished message to be in words"], 1, "A specific purpose is concrete and measurable: the result you want."], ["What does an audience-centered approach involve?", ["Adapting the message to the audience's needs, with empathy", "Using the same message for every reader", "Writing the message the way you would say it to a friend", "Focusing on what the company wants to say"], 0, "The audience-centered approach puts the reader's needs, interests, and expectations first."], ["When is the direct approach usually best?", ["When you want to delay the main point as long as possible", "When the news is likely to come as a shock to the reader", "When the audience is likely to resist or reject the message", "When the audience is receptive or neutral toward the message"], 3, "The direct approach states the main idea first. The indirect approach builds up to it for resistant audiences."], ["What is the best way to define the main idea of a message?", ["Wait until the draft is finished and then decide what it says", "List every fact you have gathered about the topic in order", "State it in a single sentence that sums up what you want to say", "Copy the most important line from your research notes"], 2, "A one-sentence main idea keeps the rest of the message focused."], ["Which email practice works best for readers on mobile devices?", ["A wide table pasted into the body of the message", "Two paragraphs of background before the request", "A short subject line with the key point at the top", "One long block of text with no breaks"], 2, "Mobile readers skim, so the main point has to come first."], ["Which parts of an email most often determine whether it is opened?", ["The subject line and the opening", "The closing line and the signature", "The attachment names and the CC list", "The sender's title and the date"], 0, "Readers decide whether to open an email, and keep reading, based on the subject line and the opening."], ["Which three questions make a good final check before you send a message?", ["Is it true? Is it kind? Is it necessary?", "Is it approved? Is it filed? Is it long?", "Is it urgent? Is it signed? Is it copied?", "Is it short? Is it funny? Is it formal?"], 0, "A quick check on accuracy, tone, and need can prevent regret."], ["Which is the best example of a specific purpose?", ["I want to inform the team about the work for next week", "I want every team member to confirm the Monday 8 a.m. start by Friday", "I want to write a message that mentions Monday and the schedule", "I want to explain the schedule and talk about the start time"], 1, "A specific purpose names the audience, the action, and the timing."], ["Why should you gather information after analyzing your audience and purpose?", ["So the message can be as long as possible", "Because research always replaces planning", "Because the audience analysis is no longer needed", "So you know exactly what the audience needs to know"], 3, "Audience and purpose tell you what information is relevant."], ["What does the receiver do when decoding a message?", ["Puts the idea into words or symbols to send it onward", "Adds noise that changes the message while in transit", "Selects the medium that will carry the message forward", "Interprets the symbols to work out their meaning"], 3, "Decoding is the receiver's interpretation of the message. Encoding is the sender's job."]]}, {"name": "Set B", "desc": "Style, revising and scenarios", "qs": [["Which sentence best uses the 'you' viewpoint?", ["Refunds are handled by our accounting department.", "Our policy is to issue refunds promptly each week.", "You will receive your refund within five business days.", "We process every refund within five business days."], 2, "The 'you' viewpoint centers the message on the reader's benefit instead of the company's actions."], ["Which sentence is in the active voice?", ["The manager approved the plan.", "The plan was approved by the manager.", "Approval of the plan was given today.", "The plan has been approved already."], 0, "In active voice the subject performs the action."], ["Which sentence is in the passive voice?", ["Maria reviewed the report carefully.", "Our team wrote the report together.", "The report was reviewed by the board.", "The board reviewed the report."], 2, "In passive voice the subject receives the action."], ["When can the passive voice be a good choice?", ["When you want the sentence to be as short and direct as possible", "When you want to be tactful or the person doing the action is unknown", "When you want the message to sound more direct and forceful in tone", "When the reader already knows the topic better than you do"], 1, "Passive voice can soften bad news or hide an unknown actor, but it is wordier than active voice."], ["Which phrase is redundant?", ["Project schedule", "Past history", "Final report", "Annual budget"], 1, "History is already in the past, so 'past' repeats the meaning."], ["Which of these phrases is redundant?", ["Quarterly review", "Sales forecast", "End result", "Weekly meeting"], 2, "A result is already at the end, so 'end' adds nothing."], ["Which revision removes the redundancy in 'Please return the form back to me'?", ["Please go ahead and return the form back.", "Return back the form to me please.", "Please return the form to me.", "Please kindly return the form back to me."], 2, "'Return' already means to give back."], ["Which is the most concise way to say 'due to the fact that'?", ["On account of how", "Because", "Since the time that", "In light of the fact"], 1, "Short, plain words replace wordy phrases without changing the meaning."], ["Which word choice is best for plain business writing?", ["Employ the usage of", "Use", "Make utilization of", "Utilize"], 1, "Plain language uses familiar words so readers understand quickly."], ["Which is the best example of bias-free language?", ["Sales girl", "Sales guy", "Salesman", "Salesperson"], 3, "Neutral terms avoid assuming a person's gender."], ["Which sentence has the most appropriate conversational tone for business?", ["OMG, I totally forgot the numbers, so sorry!!", "The undersigned shall endeavor to transmit said figures.", "Yo, numbers coming tomorrow, probably around noon.", "I will send the revised numbers by noon tomorrow."], 3, "Business tone is natural and friendly without slang or stiff, legalistic wording."], ["Which sentence uses the most positive wording?", ["Your order will not be shipped before Friday.", "We cannot ship your order until Friday.", "Unfortunately, shipping will be delayed until Friday.", "We can ship your order by Friday."], 3, "Positive wording states what you can do rather than what you can't."], ["How do you build credibility with your audience?", ["Be honest, objective, and knowledgeable, and back up your claims", "Use strong, confident words and skip the evidence to save space", "Agree with whatever the audience already believes about the topic", "Mention your job title and years of experience in every paragraph"], 0, "Credibility is earned through honesty, evidence, and competence."], ["What does a topic sentence do?", ["Closes the paragraph with a summary", "States the main idea of a paragraph", "Lists every detail the paragraph will cover", "Introduces the writer to the reader"], 1, "A topic sentence tells the reader what the paragraph is about."], ["Which pair of items is written in parallel structure?", ["Read, writing, and to speak", "Reading, writing, and speaking", "Reading, to write, and speaking", "To read, writing, and speak"], 1, "Parallel structure uses the same grammatical form for items in a list."], ["What is the purpose of transitions such as 'however' and 'therefore'?", ["To hide weak arguments from the reader", "To show how ideas relate to each other", "To replace the topic sentences", "To make the document longer"], 1, "Transitions guide the reader from one idea to the next."], ["What is the main goal when revising a draft?", ["Evaluate and improve the content, organization, style, and tone", "Check only the spelling, punctuation, and grammar of the draft", "Add as many new ideas to the draft as you possibly can", "Make the message longer and more formal so it sounds expert"], 0, "Revision focuses on the message itself, while proofreading catches surface errors."], ["What does proofreading involve?", ["Rethinking the main idea of the message and how it is organized", "Checking for errors in spelling, grammar, punctuation, and format", "Choosing a different medium to deliver the finished message", "Rewriting the opening paragraph and the closing from scratch"], 1, "Proofreading is a final check for mechanical and formatting errors."], ["When should you proofread?", ["At the same time as you are gathering the information", "Before you plan the message or gather information", "Only after the audience has complained about errors", "After you have revised and produced the final version"], 3, "Proofreading comes last, because revising can introduce new errors."], ["Which choice improves readability?", ["Long sentences packed with technical terms", "One long paragraph with no headings", "Complex words to show your expertise", "Short sentences and familiar words"], 3, "Readable writing is easy for the audience to process."], ["Which subject line works best for an email?", ["Quick question about something we discussed", "Important!!! Please read this message now", "Hello from the finance department team", "Budget approval needed by Friday, May 3"], 3, "A specific subject line tells readers what the message is about and what is needed."], ["When is it appropriate to use 'Reply All'?", ["Any time you want to be polite", "Only when every recipient needs the information", "Whenever you agree with the sender", "Whenever you want to show that you read it"], 1, "Unneeded Reply All messages add to email overload."], ["What makes the closing of a business email effective?", ["It repeats the opening in slightly different words", "It states the next step, with who does what and by when", "It apologizes for taking up so much of the reader's time", "It adds a joke at the end to leave a good impression"], 1, "A clear next step turns a message into action."], ["What does writing a business email in all capital letters usually signal?", ["Respect for the reader's time", "Shouting, which can come across as rude", "A request for the reader's quick response", "Extra professionalism and formality"], 1, "All caps is read as shouting and makes text harder to read."], ["Which is the best guidance on slang and emoticons in business messages?", ["Use them to make bad news sound lighter and less serious", "Use them only in the subject line to catch attention", "Avoid them, especially with unfamiliar or formal audiences", "Use them in every message so that you sound friendly and warm"], 2, "Professional messages keep a respectful tone, especially when you do not know the reader well."], ["When should you use bullet points?", ["For a list of parallel items that readers will scan", "To replace the topic sentence of a section", "For every paragraph in a document", "For a story with a beginning, middle, and end"], 0, "Bullets help readers scan items that are similar in form and importance."], ["Which medium suits an urgent, sensitive message to one employee?", ["A post on the company's internal social network", "A mass email to everyone in the whole department", "A private face-to-face or phone conversation", "A text message sent late in the evening after hours"], 2, "Sensitive news calls for a private, rich channel that allows questions."], ["One team member dominates every meeting. What is a good first step?", ["Ignore it and hope that the problem resolves itself", "Cancel the team's meetings and work alone from now on", "Set ground rules so everyone has a chance to contribute", "Ask the other members to stay quiet and let the leader talk"], 2, "Ground rules make participation fair and keep the group on task."], ["Which is a sign of groupthink?", ["Everyone agrees quickly and dissenting views are discouraged", "A member raises concerns and the team responds to them", "The team asks an outside expert to review its plan", "Members debate several options carefully before they decide"], 0, "Groupthink values harmony over honest evaluation."], ["The audience is likely to resist your request. Which approach is usually best?", ["The indirect approach, building support before the main point", "No explanation, only a short command", "The direct approach, stating the request in the first line", "A very long introduction about your own background"], 0, "With a resistant audience, explain your reasons first so they are ready to listen."], ["Which source is the most credible for a business report?", ["A friend's strong opinion shared in a text message", "An anonymous post on a public online discussion forum", "A peer-reviewed study or a respected industry report", "A blog with no author, no date, and no sources listed"], 2, "Credible sources are identifiable, accurate, and current, which is part of digital information fluency."], ["What is plagiarism?", ["Summarizing a report in your own words with a citation", "Using someone else's words or ideas without giving credit", "Quoting a source and citing it properly", "Asking a coworker for feedback on your draft"], 1, "Giving credit is a basic part of ethical communication."], ["What is information overload?", ["Receiving too little information to be able to make a decision", "An audience that refuses to read anything sent to them", "Receiving more information than a person can process effectively", "A technical failure that deletes messages from the server"], 2, "Information overload is a barrier that causes people to ignore or misunderstand messages."], ["Which practice helps when writing for non-native English speakers?", ["Use abbreviations freely without explaining them", "Write long sentences so nothing is left out", "Avoid idioms and slang; keep wording simple", "Use as many idioms as possible to be friendly"], 2, "Idioms rarely translate, so plain language prevents confusion."], ["Which attitude helps most when working across cultures?", ["Staying open-minded and curious about how others do things", "Assuming your own way is the standard way", "Treating every person as a typical member of a group", "Avoiding contact so you cannot offend anyone"], 0, "Openness and tolerance reduce ethnocentrism and stereotyping."], ["Which action best shows accountability at work?", ["Explaining why the mistake was someone else's fault", "Admitting a mistake and working quickly to fix it", "Hoping nobody notices the mistake", "Waiting until your manager asks about it"], 1, "Accountability is part of professionalism: owning results, good and bad."], ["Which detail best shows empathy in a message to a customer?", ["Pointing out that other customers had no issue with the product", "Moving straight to the refund form without any comment", "Explaining the company's policy in detail before anything else", "Acknowledging the customer's frustration before offering a solution"], 3, "Empathy means seeing the situation from the reader's point of view."], ["Why should you adapt a message to the audience's level of knowledge?", ["So the message can be kept as short as possible for the reader", "So the message is clear without being condescending", "So the reader will never need to give any feedback at all", "So you can avoid planning the main idea of the message"], 1, "Matching the audience's knowledge makes messages clear and respectful."], ["Which action belongs in the writing step of the three-step process?", ["Distributing the message to the audience", "Analyzing the audience's needs and expectations", "Proofreading the final version of the message", "Organizing your ideas and composing the first draft"], 3, "Writing covers organizing the content and composing the message. Check your notes for your instructor's wording."], ["Which word replaces 'in the event that' most concisely?", ["If", "Provided that it happens", "At such time as", "When and if"], 0, "Short, plain words say the same thing in fewer words."]]}]}, {"id": "e2", "title": "Exam 2", "sub": "Chapters 6 to 9", "topics": "Digital channels, routine and positive messages, negative messages, persuasive messages", "sets": [{"name": "Set A", "desc": "Recall, chapter order", "qs": [["Which compositional mode intentionally withholds key information to pull readers into a story or document?", ["Orientation", "Teaser", "Tutorial", "Summary"], 1, "Teasers withhold key information to draw readers in, and are common in marketing. The payoff has to be valuable and legitimate or you lose credibility."], ["Which pair of uses for augmented reality appears in your class notes?", ["Gamification and training applications", "Podcasting and RSS subscriptions", "Spim and instant messaging", "Content curation and press releases"], 0, "Your notes list gamification and training applications as uses for augmented reality. It overlays data on live camera images."], ["A group of people who share enthusiasm for a particular product or activity is called a community of:", ["Champions", "Practice", "Interest", "Purpose"], 2, "Communities of interest share enthusiasm for a product or activity. Communities of practice are people who engage in similar work."], ["Which parts of an email often determine whether it gets opened and read?", ["The subject line and the opening", "The signature block and the footer", "The closing line and the CC list", "The attachment names and the date"], 0, "Per your notes, the subject and the opening decide whether readers open the message and keep reading."], ["Which of the following is NOT a compositional mode for digital media?", ["Narratives", "Contracts", "Conversations", "Teasers"], 1, "The modes are conversations, comments and critiques, orientations, summaries, reference materials, narratives, teasers, status updates and announcements, and tutorials."], ["Which compositional mode works as a miniature version of a document at the start, or a review of key points at the end?", ["Narrative", "Teaser", "Summary", "Orientation"], 2, "Summaries give key points while skipping details at the start, and remind readers of key points at the end."], ["People typically search reference materials instead of reading them start to finish. What does this mean for the writer?", ["Withhold the key facts as a teaser so readers keep reading to the end", "Use long unbroken paragraphs so readers see all the details at once", "Write them as informal conversations that readers follow in order", "Make them searchable and use clear headings that promote skimming"], 3, "Make the material accessible to search engines, include an orientation, and organize it with clear headings."], ["Which compositional mode helps people find their way through an unfamiliar system, and requires you to see it from a 'newbie' perspective?", ["Status update", "Orientation", "Summary", "Comment"], 1, "Orientations are a balancing act: you must know the material well but view it as a beginner would."], ["Which is a good reason to choose a printed message over an electronic one?", ["It is easy to edit and update after the message is sent", "It is always the cheapest way to reach a large audience", "You are legally required to provide the information in print", "It is the fastest option available for most messages"], 2, "Print fits when you want a formal impression, want to stand out, are legally required, need a permanent secure record, or can't reach the audience electronically."], ["How does a teaser differ from a tutorial?", ["A teaser withholds key information; a tutorial teaches how to do something", "A teaser teaches how to do something; a tutorial withholds key information", "A teaser is always long; a tutorial is always a single sentence", "They are the same mode, just used on different websites"], 0, "A teaser deliberately holds back key information to pull readers in. A tutorial gives how-to advice and builds your reputation as an expert. Be ready to tell the modes apart."], ["What is the general guidance on emoticons in business messages?", ["Generally avoid them", "Use them in every message to show warmth", "Use them only in the closing line", "Use them whenever the reader is a customer"], 0, "Your notes say to generally avoid emoticons. Keep business messages professional, especially with unfamiliar or formal audiences."], ["How does the appropriate style for business IM compare with personal IM or texting?", ["Less formal", "It uses only abbreviations", "More formal", "Identical"], 2, "Business IM should be more formal than the style you may use for personal IM or text messaging."], ["Podcasting is best defined as:", ["Collecting and republishing content created by others", "Sending bulk email messages to a list of subscribers", "Posting short messages limited by a set character count", "Recording audio or video files and distributing them via RSS"], 3, "Podcasting combines the richness of voice or video with portability, distributed via RSS."], ["A sales message opens with a bold headline and a surprising statistic. Which AIDA phase is this?", ["Attention", "Interest", "Desire", "Action"], 0, "Attention is the first phase of AIDA: Attention, Interest, Desire, Action. A bold opening grabs the reader."], ["In a direct routine request, the opening should:", ["Start with background and build up slowly to the request", "State the request clearly up front, politely and specifically", "Open with a buffer that eases the reader into the request", "Thank the reader in advance for cooperating with the request"], 1, "A direct request puts the main idea first. Thanking someone 'in advance' can seem presumptuous."], ["Which three principles should guide a condolence letter?", ["Short, simple, and sincere", "Formal, detailed, and thorough", "Objective, neutral, and documented", "Persuasive, brief, and promotional"], 0, "Condolence letters are brief, personal messages. You don't need a work of literary art; the fact that you wrote is what matters."], ["With a traditional press release, who is the immediate audience?", ["The company's customers, who read the release directly", "An editor or reporter who will write the story the public reads", "The company's employees, who read every release first", "Government regulators who review corporate announcements"], 1, "A news release tries to interest an editor or reporter, who writes the material the larger audience reads. Social media releases are aimed more directly at consumers."], ["A routine request should close with all of these EXCEPT:", ["A specific action request with any deadline", "How you can be reached", "An expression of appreciation or goodwill", "A demand that the reader act at once"], 3, "Close with a specific request (with deadline), contact information, and goodwill. Don't demand action."], ["What is the first step when granting a customer's claim?", ["Offer a refund", "Ask the customer to resubmit", "Acknowledge the complaint", "Blame a colleague"], 2, "The steps: acknowledge, sympathize, take responsibility, explain how you'll resolve it, repair the relationship, follow up."], ["A letter of recommendation should include:", ["Only the candidate's name and the position applied for", "Your relationship to the candidate, plus facts and evidence", "A frank list of the candidate's weaknesses and flaws", "Your personal opinion of the candidate's current employer"], 1, "Include the candidate's full name, position sought, your relationship, evidence, comparison with peers if available, and your overall evaluation."], ["How is the nature of the news release changing?", ["It must now be handwritten and mailed to editors", "It is no longer used by any modern company at all", "It is now written only for lawyers and regulators", "Many are now social media releases for consumers"], 3, "Social media releases include social links, Twitter-ready statements, and sharable content."], ["A routine reply that says 'yes' to a request should open with:", ["A lengthy background explanation", "A buffer before the news", "The main idea or good news", "An apology for the delay"], 2, "Use the direct plan: main idea first, details in the body, courteous close."], ["When asking someone for a letter of recommendation, what should the close include?", ["A request that the writer ignore any deadline", "A reminder of the rewards the writer will receive", "Your résumé alone, with no other information", "Appreciation, where to send it, and any deadline"], 3, "Express appreciation and give the recipient's full name and address. If you need it immediately, mention the deadline."], ["What approach should you use for most routine claims, especially in your first letter?", ["Indirect, opening with a buffer to soften the request", "A teaser that withholds the request until the end", "Direct, assuming a fair adjustment will be made", "A threat of legal action to speed up the reply"], 2, "Open with a straightforward statement of the problem, give specifics, and ask for specific action."], ["What is the best channel for delivering bad news to employees, whenever possible?", ["A company blog post", "Email", "In person", "A text message"], 2, "In person shows respect and gives employees a chance to ask questions."], ["How does the indirect approach to a negative message open?", ["With a buffer", "With a deadline", "With an apology", "With the bad news"], 0, "A buffer is a neutral, relevant, sincere statement that establishes common ground. Then come reasons, the bad news, a positive angle, and a respectful close."], ["What is the correct guidance on the timing of bad news?", ["Deliver it promptly, since delay can be unethical or illegal", "Wait until you have an answer ready for every possible objection", "Wait until the reader is in a good mood and has time", "Deliver it only if the reader asks you about it directly"], 0, "Withholding or delaying bad news can be unethical and even illegal, so deliver it promptly. Whether you then use the direct or indirect approach depends on the situation."], ["In the direct approach for a negative message, what comes first?", ["A buffer", "A positive close", "The reasons", "The bad news"], 3, "Direct: bad news, reasons, additional information, positive angle, respectful close."], ["Which describes a condolence note in a business setting?", ["Totally appropriate, and handwritten is better than typed", "Inappropriate, because personal matters stay out of business", "Appropriate only when sent as a mass email", "Appropriate only for customers, never for coworkers"], 0, "Your notes call condolence letters totally appropriate, and a handwritten note is better than a typed or electronic one. Keep it short, simple, and sincere."], ["When rejecting a job applicant, which should you avoid?", ["Explaining why the applicant was rejected", "Using the applicant's name in the opening", "Closing with sincere wishes for future success", "Thanking them for applying for the position"], 0, "The safest strategy is a minimal approach that doesn't explain the reasons."], ["Which approach is usually best when refusing a customer's claim?", ["No response", "A teaser", "Direct", "Indirect"], 3, "Customers making claims are usually emotionally involved, so the indirect approach is usually best."], ["What is defamation?", ["A request for a refund on a purchase made last month", "A false statement that harms someone's reputation", "An honest apology offered for a serious mistake", "A truthful complaint about poor customer service"], 1, "Resist calling a customer dishonest or incompetent, or you could be sued for defamation."], ["In the reasons section of an indirect message, how should you order your points?", ["Go from positive or neutral points to negative ones", "Random order so the reader cannot predict the outcome", "Mention only the company policy and nothing else", "Put the most negative reason first, before any others"], 0, "An ideal explanation leads readers to your conclusion before you say it."], ["What does the AIDA model stand for?", ["Attention, Interest, Desire, Action", "Awareness, Interest, Demand, Approval", "Analyze, Inform, Decide, Act", "Attention, Information, Decision, Agreement"], 0, "AIDA is Attention, Interest, Desire, Action. It suits the indirect approach because the main request is saved for the action phase."], ["Which statement correctly contrasts selling points (features) and benefits?", ["Features describe what the product does; benefits describe what the user gains", "Features describe what the user gains; benefits describe what the product does", "Features are for sales messages; benefits are for marketing messages", "They mean the same thing and can be used interchangeably"], 0, "Selling points are features: what the product does. Benefits are what the user gains or experiences from those features."], ["Persuasion is best defined as the attempt to change an audience's:", ["Location or office address", "Budget limits or spending plans", "Schedule or working hours", "Attitudes, beliefs, or actions"], 3, "Persuasion is not trickery. It is letting audiences know they have choices and presenting your offering in the best light."], ["In your notes, reasoning by comparison, such as an analogy, counts as which type of reasoning?", ["Inductive", "Deductive", "Circular reasoning", "Attacking an opponent"], 0, "Your class notes group comparison with inductive reasoning. Deductive reasoning moves from a general principle to a specific conclusion."], ["A hasty generalization is:", ["Comparing two similar things to make a point", "Restating your claim as if it were proof", "Attacking a person instead of the idea", "A conclusion drawn without enough evidence"], 3, "Make sure you have plenty of evidence before drawing conclusions."], ["How do sales messages differ from marketing messages?", ["They are identical in every way and purpose", "Sales messages push for a purchase right away", "Sales messages never use the AIDA approach at all", "Marketing messages are always illegal to send"], 1, "Marketing messages usher buyers through the process without asking for an immediate decision; sales messages push for one."], ["Which U.S. agency can penalize advertisers who violate federal truthful-advertising standards?", ["The SEC only", "The IRS", "The FDA only", "The FTC"], 3, "Your notes pair truth in advertising with ethics and the FTC. The FTC enforces the federal standards and can penalize advertisers who break them."]]}, {"name": "Set B", "desc": "Scenarios, Ch. 9 back to 6", "qs": [["An ad claims a supplement 'cures colds in 24 hours' but the company has no evidence. Which truth-in-advertising rule does this break?", ["Claims must be supported by evidence and not be deceptive", "Ads must always be written in the indirect approach", "Ads can never use emotional appeals to persuade readers", "Ads must always include a firm deadline for action"], 0, "Marketing messages must be truthful and not deceptive, and claims must be backed by evidence. The FTC can penalize violators."], ["A store advertises a very cheap TV, then tells shoppers it's 'sold out' and steers them to a pricier model. What is this practice?", ["A soft sell, which is a calm approach", "A teaser, which is a legal tactic", "Content curation, a common practice", "Bait and switch, which is illegal"], 3, "Bait and switch advertising is illegal."], ["'All new hires need safety training. Sam is a new hire, so Sam needs safety training.' This reasoning moves from:", ["Specific evidence to a general conclusion (inductive)", "A general principle to a specific conclusion (deductive)", "A claim restated as its own proof (circular)", "Specific evidence to specific evidence (analogy)"], 1, "Deduction starts with a general statement and applies it to a specific case."], ["A manager says, 'Temps can't handle this task because temps are unqualified for it.' Which faulty logic is this?", ["Attacking an opponent", "Faulty analogy", "Mistaken cause and effect", "Circular reasoning"], 3, "Circular reasoning supports a claim by restating it in different words. 'Can't handle the task' and 'unqualified' say the same thing."], ["Which phrase from a product ad is a BENEFIT rather than a feature (selling point)?", ["'Work through a flight without hunting for an outlet'", "'Rated for a 12-hour battery life on a full charge'", "'Weighs only 2 pounds with the battery installed'", "'Backlit keyboard with adjustable brightness'"], 0, "A benefit tells what the user experiences or gains. The other options are features: what the product does or has."], ["A sales page offers testimonials, a demo, and a money-back guarantee. Which phase of AIDA is this mainly supporting?", ["Desire", "Action", "Attention", "Interest"], 0, "Desire is built by expanding on benefits and answering doubts with demonstrations, testimonials, and guarantees."], ["A manager says, 'Sales went up the last time we lowered prices, so lowering them again will raise sales.' Which faulty logic is this?", ["Attacking an opponent", "Mistaken cause and effect", "Circular reasoning", "Faulty analogy"], 1, "Sales might have risen for other reasons, such as advertising or weather. If you can't isolate the factor, don't assume it was the cause."], ["A buyer says, 'All 200 customers we surveyed prefer the new package, so our customers prefer the new package.' This reasoning moves from:", ["Specific evidence to a general conclusion (inductive)", "A general principle to a specific conclusion (deductive)", "A claim restated as its own proof (circular)", "One cause to an unrelated effect (mistaken cause)"], 0, "Moving from specific evidence to a general conclusion is inductive reasoning. Deductive reasoning goes the other way, from a general principle to a specific conclusion."], ["A salesperson says, 'You either buy now or forget the whole thing.' Which faulty logic is this?", ["Circular reasoning", "Mistaken cause and effect", "Oversimplifying a complex issue", "Faulty analogy"], 2, "Don't reduce a complex situation to a simple either/or."], ["A manager says, 'Our Reno store thrived with this layout, so a Boise store with the same layout will thrive too.' Your notes classify this reasoning by comparison as:", ["Inductive", "Deductive", "Circular", "An attack on an opponent"], 0, "Reasoning by comparison counts as inductive in your notes. Check that the two situations are truly alike, or it becomes a faulty analogy."], ["Your audience is hostile to your plan from the start. What does the text advise?", ["Use a hard sell and press the reader toward your plan quickly", "Skip the explanation and simply announce the final decision", "Hide the downsides so the audience stays open to the plan", "Present all sides, pros and cons, before your recommendation"], 3, "You gain credibility by presenting options before the recommendation, and by involving the audience in the solution if you can."], ["A company wants to feature a customer's photo in an ad. What should it do first?", ["Post it immediately", "Nothing; photos are free to use", "Get the customer's permission", "Edit the photo"], 2, "In most cases you can't use a person's name, photograph, or other identity without permission."], ["A company wants to promote a product on a phone app. Which advice fits mobile promotion?", ["Require users to read the terms before they continue", "Use long, detailed paragraphs to explain every feature", "Lead with slow-loading video to show off the product fully", "Keep messages short and simple, and make the experience quick"], 3, "Mobile users are time-constrained and will quickly abandon slow or confusing sites."], ["Why do companies build communities of interest around their products and services?", ["To build relationships with customers and support sales", "To keep employees away from social media during work", "To replace the company website with a social page", "To store legal records of customer complaints"], 0, "Communities of interest bring together people who share enthusiasm for a product or activity. In the sales world, companies use them to build relationships with customers."], ["A manager must tell a long-time employee that her performance review is negative. The employee is likely to be emotionally involved. Which approach fits best?", ["No explanation at all", "A teaser", "Direct, with the bad news first", "Indirect"], 3, "High emotional involvement points to the indirect approach, and negative performance reviews are a listed example."], ["Which opening is the best buffer for a message rejecting a vendor's proposal?", ["'Thank you for the care you put into your proposal.'", "'Company policy prohibits us from working with new vendors.'", "'Unfortunately, we cannot accept your proposal.'", "'Congratulations on your great news!' (when there is none)"], 0, "A good buffer is relevant, sincere, and establishes common ground. Stating 'unfortunately' up front is the bad news itself, the fake congratulations misleads the reader, and the policy line hides behind policy."], ["Which is the best way to deliver a termination letter?", ["Through a post on the company's social media page", "By a company-wide email sent to every department", "By text message so nobody has to face a confrontation", "In person, in a private meeting, if at all possible"], 3, "Deliver termination letters in person if possible, in a private setting free of interruptions. Have another manager review the letter and involve legal staff."], ["You're rejecting a job applicant. Which practice does the text recommend as the safest approach?", ["Personalize it, thank the applicant, and skip the reasons why", "Explain in detail why other applicants were chosen", "Offer vague hopes that a future position may open up", "Promise that the application will be reviewed again later"], 0, "A minimal approach lowers the risk of discrimination claims. Don't state or imply the application will be reviewed later."], ["A company must announce layoffs. Which advice from the text fits best?", ["Use a single channel only and avoid all the others", "Offer false optimism to keep morale high", "Minimize surprise and give people time to prepare", "Keep it a surprise until the last possible moment"], 2, "Also consider each group's needs, plan answers to expected questions, and seek expert advice."], ["A customer's request seems outrageous and you suspect dishonesty. What should you do?", ["Threaten legal action to discourage future claims", "Call the customer a liar in the reply", "Stick to the facts and avoid abusive language", "Ignore the request and say nothing back"], 2, "Calling someone dishonest could expose you to a defamation claim. Consult legal advisors if there may be legal consequences."], ["A toxic spill occurs at your plant. Which approach should the announcement take?", ["Post the news on social media only", "Indirect, with a long buffer first", "Delay until the lawyers have finished reviewing", "Direct, getting to the point immediately"], 3, "In an emergency, get to the point immediately."], ["A false rumor about your company is spreading on social media. What should you do before responding?", ["Delete every comment that mentions the rumor", "Ignore all negative messages and hope it fades away", "Evaluate the source, tone, and content of the message", "Fire back immediately with a strongly worded reply"], 2, "Four steps: engage early and often, monitor the conversation, evaluate negative messages, and respond appropriately."], ["You must reject an employee's proposal. How thorough should your explanation be?", ["Brief and vague, to avoid an argument", "Refer her to company policy and leave it there", "None at all; simply say no and move on", "Full and careful, so the relationship isn't damaged"], 3, "The closer your working relationship, the more thoughtful and complete you need to be."], ["A letter ends with 'I trust our decision is satisfactory.' Why is this a weak close for a final decision?", ["It implies the matter is open to discussion", "It is far too formal for a business letter", "It is too long for a closing line", "It uses a buffer in the wrong place"], 0, "If the decision is final, avoid statements that imply it is open to negotiation."], ["A company promised delivery in 24 hours but can't meet it. What should the message do?", ["Say nothing and wait for the customer to complain", "Blame the customer for expecting such a fast delivery", "Reset expectations, explain the fix, and rebuild trust", "Offer no details so that you cannot be held to them later"], 2, "If you set expectations and can't meet them, the task is more complex than a simple notice."], ["A CEO announces a 10,000-person layoff as 'an opportunity for employees to explore new horizons.' What is the problem?", ["It is too short to explain the details", "It is false optimism that ignores the trauma", "It uses a buffer that is too long", "It is too direct for such serious news"], 1, "Look for positive angles but avoid false optimism. Thanking people and wishing them well may be the best you can do."], ["You need data from the research department. What's the best way to word the request?", ["'Please send the latest market data as a summary.'", "'Thanks in advance for sending the data soon.'", "'Please send me some data about the market this week.'", "'Please send me everything you have on the market.'"], 0, "Be specific about precisely what you want, such as a one-page summary versus 100 pages of raw data."], ["A customer complains and your company is at fault. What is the best first sentence?", ["'You should have read the instructions before calling us.'", "'It wasn't our fault, so there is nothing for us to fix.'", "'Company policy states that all sales are final, no exceptions.'", "'We received your complaint and are sorry for the trouble.'"], 3, "Acknowledge receipt and sympathize before explaining how you'll fix the problem."], ["A customer asks a straightforward question and the answer is 'yes.' What plan should you use?", ["No plan", "A teaser", "Indirect", "Direct"], 3, "If the answer is yes or simple information, use the direct plan."], ["A coworker's parent has died. Which note is best?", ["A short, handwritten note with sympathy and an offer of help", "A mass email sent to every person in the whole company", "A message that focuses mostly on unrelated business matters", "A long, formal essay about the parent's entire life story"], 0, "Condolences are totally appropriate in business, and a handwritten note is better than a typed one. Keep it short, simple, and sincere."], ["A company opens a new facility and wants media coverage. Which document should it send?", ["A claim", "A termination letter", "A refusal", "A press release"], 3, "News releases communicate good news to the media. The audience is an editor or reporter."], ["You're asking a former professor you haven't contacted in years for a recommendation. What should the opening do?", ["Offer to write a letter for the professor in return", "Recall your relationship and the dates, if helpful", "Skip straight to the deadline without any context", "Apologize at length for not keeping in touch earlier"], 1, "If you haven't had contact for some time, recall the relationship, dates, and any special events that bring a favorable picture of you to mind."], ["A project manager needs to send a team a long message with detailed instructions. Which channel is best?", ["Email", "Instant message", "Text message", "Microblog post"], 0, "Long messages call for email. Don't use IM for lengthy, complex messages."], ["A company wants a permanent, unchangeable, secure record of a notice. Which medium fits best?", ["A podcast", "A tweet", "An instant message", "A printed message"], 3, "Printed messages fit when you need a formal impression, a permanent or secure record, or when law requires printed documents."], ["You need to notify a colleague of a quick, urgent change within minutes. Which channel fits best?", ["Blog post", "Instant message", "Printed letter", "Podcast"], 1, "IM gives rapid response to urgent messages."], ["An employee wants to share how-to advice and become known as a reliable expert. Which compositional mode fits?", ["Summary", "Tutorial", "Teaser", "Comment"], 1, "Tutorials share how-to advice, building loyalty and your reputation as an expert."], ["A software company has senior engineers publish detailed posts about their field, and the posts also mention the company's new products. How is the blog being used?", ["As expert documentary content that also promotes the company", "As a private diary with no connection to the business", "As a secure archive for confidential company files", "As an instant messaging channel for the engineering staff"], 0, "Your notes describe blogs as documentary content by experts that can also be used promotionally."], ["A company wants to capture expert knowledge from employees nearing retirement and meet younger employees' expectations. What should it build?", ["A podcast", "A microblog", "A public general-purpose network", "A private social network"], 3, "Private networks are built for internal use."], ["A retailer wants shoppers to see information about nearby stores by pointing a phone camera at the street. Which technology?", ["Augmented reality", "Podcasting", "Content curation", "Spim"], 0, "Augmented reality superimposes data on live camera images. Your notes list gamification and training applications as other uses."], ["An employee is about to send confidential data over an IM system that is not secure. What does the text advise?", ["Don't send confidential data over an insecure system", "Send it twice so that at least one copy gets through", "Use all caps so that the importance is clear to everyone", "Go ahead since the system is only used internally"], 0, "If you are not on a secure system, do not send confidential information."]]}, {"name": "Set C", "desc": "Mixed order, tricky wording", "qs": [["Which is NOT a characteristic of an effective blog?", ["An impersonal corporate voice", "Personal style and authentic voice", "Topics of peak audience interest", "New information delivered quickly"], 0, "Effective blogs also encourage the audience to join the conversation."], ["Which phase of AIDA asks readers to take a specific step, such as 'Order by Friday'?", ["Action", "Attention", "Interest", "Desire"], 0, "Action is the last phase of AIDA. It tells readers exactly what to do next and makes it easy to do."], ["Which is NOT recommended when preparing a termination message?", ["Present reasons clearly and without discrimination", "Avoid personal attacks", "Have another manager review it", "Skip legal input to save time"], 3, "Termination messages should be written with input from the company's legal staff."], ["Which statement about teasers is TRUE?", ["The payoff they link to must be valuable and legitimate", "They are never used in marketing messages or ads", "They should link to worthless information for contrast", "They are used only in condolence letters and apologies"], 0, "Readers quickly lose trust if they feel tricked into clicking through to something they don't want."], ["Which is an example of a FAULTY ANALOGY?", ["Citing a survey of 500 customers", "Describing a product benefit", "Saying an internet firewall is like a prison wall", "Presenting evidence and naming your sources"], 2, "A firewall keeps things out, while a prison wall keeps things in. The two aren't similar enough for the comparison to hold."], ["Which is NOT a legal aspect of promotional communication listed in the text?", ["Claims must be supported by reliable evidence", "Messages must be truthful and not deceptive", "Messages must be written in the third person", "Bait and switch is illegal under federal rules"], 2, "Other points: special rules for children, binding contracts, permission to use a person's identity, and spam, privacy, and data security regulations."], ["Psychographics describe an audience's:", ["Personality, attitudes, and lifestyle", "Job title and years of experience", "Age, income, and education level", "Gender and where they live"], 0, "Demographics are quantifiable (age, gender, occupation, income, education). Psychographics are psychological characteristics."], ["Which statement about persuasion is TRUE?", ["It is a process of listening, testing, and compromise", "It is a one-time event that ends with a clear winner", "It depends only on how strong your main arguments are", "It never requires compromise from either side involved"], 0, "A persuader rarely changes another person's views without altering their own."], ["Which is NOT a business use of social networks?", ["Recruiting new employees and contractors", "Understanding the needs of target markets", "Guaranteeing that all content stays private", "Fostering collaboration among employees"], 2, "Uses include integrating workforces, collaboration, communities, socializing brands, understanding markets, recruiting, sales prospects, customer support, and extending the organization."], ["What is the purpose of the indirect approach?", ["To hide the bad news so the reader never learns it", "To ease the impact of bad news and help readers accept it", "To limit your legal responsibility for the decision", "To put off the news until the reader stops asking"], 1, "It is not meant to obscure bad news. Done poorly, it can be disrespectful or unethical."], ["In which stage of the three-step writing process does analyzing audience needs take place?", ["Planning", "Distributing", "Completing", "Writing"], 0, "Analyzing the situation and audience is part of the planning step."], ["Which would NOT typically appear in a good condolence letter?", ["An offer of assistance or prayer", "A long, elaborate literary tribute", "A brief, positive memory", "A simple expression of sympathy"], 1, "Keep it short, simple, and sincere. You don't need to produce a work of literary art."], ["When refusing a routine request that is truly closed, which should you AVOID?", ["'Let me think about it and get back to you'", "Offering alternatives if they are worthwhile", "A quick and gracious reply to the reader", "Saying clearly that the matter is closed"], 0, "Don't imply the matter is still open or use delaying tactics."], ["Which statement about benefits is TRUE?", ["They apply only to sales messages, not marketing", "They are exactly the same thing as selling points", "They focus on what the product does or contains", "They focus on what the user experiences or gains"], 3, "Selling points focus on what the product does. Benefits focus on what the user gains."], ["What is the first of the four steps for responding to rumors and negative information?", ["Wait for press coverage", "Engage early, engage often", "Fire back", "Delete comments"], 1, "The four: engage early and often, monitor the conversation, evaluate negative messages, respond appropriately."], ["Which statement about blogs matches your class notes?", ["They often share documentary content written by experts", "They are limited to private diaries with no business use", "They can never be used to promote products or services", "They must be approved by the legal department first"], 0, "Your notes describe blogs as documentary content by experts that can also be used promotionally."], ["Reasoning from specific evidence to a general conclusion is called:", ["Attacking an opponent", "Deduction", "Circular reasoning", "Induction"], 3, "Induction moves from specific evidence to a general conclusion. Deduction moves from a generalization to a specific conclusion."], ["Which statement about podcasting is TRUE?", ["Previews and transitions are unnecessary in audio", "Podcasts cannot be distributed through company blogs", "Editing is easy, so you can fix problems afterward", "Editing is harder than in print, so prepare first"], 3, "Previews, transitions, and reviews matter because audio lacks visual cues. Aim for one take."], ["Put the indirect approach for bad news in the correct order.", ["Buffer, bad news, reasons, positive angle, respectful close", "Reasons, buffer, bad news, respectful close, positive angle", "Buffer, reasons, bad news, positive angle, respectful close", "Bad news, reasons, buffer, positive angle, respectful close"], 2, "Indirect: buffer, reasons, bad news, positive angle, respectful close. The direct approach starts with the bad news, then reasons."], ["Which statement about the close of a negative message is TRUE?", ["Use clichés", "Always invite more correspondence", "Offer false hope", "Avoid creating false hopes"], 3, "Ending on a false positive can leave readers feeling disrespected or deceived."], ["When writing the body of a direct request, you should:", ["Ask the least important questions first, then build up", "Ask every question together in one long paragraph", "Avoid mentioning any benefit to the reader, to stay brief", "Ask the most important questions first, one topic per question"], 3, "The body explains and justifies the request. Mention reader benefits, ask the most important questions first, and keep one topic per question."], ["Which statement about deductive reasoning is TRUE?", ["It moves from a general principle to a specific conclusion", "It moves from specific evidence to a general conclusion", "It compares one situation with another similar one", "It restates the claim as if it were proof"], 0, "Deductive reasoning goes from general to specific. Induction goes from specific evidence to a general conclusion, and reasoning by comparison counts as inductive in your notes."], ["All of the following are reasons to choose a printed message EXCEPT:", ["To provide a permanent, secure record of the message", "Because print is always faster than electronic options", "To stand out from a flood of electronic messages", "To make a more formal impression on the reader"], 1, "Print is chosen for formality, standing out, legal requirements, permanent records, and reaching certain audiences. Speed isn't a reason."], ["Which is a limitation of the AIDA model?", ["It cannot be used for marketing or sales messages", "It talks at audiences and ignores long-term relationships", "It has no action phase, so readers never receive a request", "It is illegal when used in any advertising message"], 1, "In social media a more conversational approach works better."], ["Which situation calls for the INDIRECT approach?", ["News that could shock or surprise an emotionally invested reader", "A reader who always prefers to hear the point directly", "An emergency where you need immediate attention and action", "A minor, routine change to the weekly meeting schedule"], 0, "Shock or surprise calls for the indirect approach. Routine news and emergencies favor the direct approach."], ["Which statement about traditional news releases is TRUE?", ["You are trying to interest an editor or reporter first", "They are written for the company's employees only", "They are never prepared by a public relations team", "They must always be published without an author name"], 0, "In most companies, news releases are prepared or supervised by the public relations department."], ["Which is an example of a goodwill message?", ["A collections notice sent to a late-paying customer", "A claim asking a company to fix a defective product", "Congratulating a colleague on a significant achievement", "A refusal of a customer's request for an adjustment"], 2, "Goodwill messages are friendly, sometimes unexpected notes. They include congratulations, thanks, and condolences."], ["Which is NOT one of the six common types of routine replies and positive messages?", ["Goodwill messages", "Answers to routine requests", "Persuasive sales pitches", "Recommendations"], 2, "The six: answers to requests, grants of claims and adjustments, recommendations, informative messages, good-news announcements, and goodwill messages."], ["Which statement about the direct approach to negative news is TRUE?", ["It makes the message shorter and reaches the main idea faster", "It requires a long explanation before the main point", "It should always open with a buffer before the news", "It is the best choice for news that will shock readers"], 0, "These are the two advantages of stating the bad news at the start."], ["Which of the following is NOT a challenge of using IM?", ["User authentication on every IM system", "Higher cost than phone calls and email", "Spim, which is spam sent over instant messaging", "Logging and archiving messages for later"], 1, "IM is lower in cost than phone and email. The challenges are security, authentication, logging, incompatible systems, and spim."], ["Which statement about the hard sell is TRUE?", ["It always works best with every kind of audience", "It is recommended for audiences that are hostile", "No one likes pressure; a soft sell uses calm persuasion", "It is legally required in all advertising messages"], 2, "Common persuasion mistakes include hard selling, resisting compromise, relying solely on arguments, and treating persuasion as one-shot."], ["Which is NOT one of the five goals when delivering negative news?", ["Increase future correspondence on the matter", "Convey the bad news clearly to the reader", "Gain acceptance for the news from the reader", "Maintain as much goodwill with the reader as possible"], 0, "The goal is to reduce future correspondence. The five goals: convey the news, gain acceptance, maintain goodwill, maintain a good organizational image, and reduce future correspondence."], ["Which is NOT a guideline for negative organizational announcements?", ["Seek expert advice before the announcement", "Bunker up and avoid social media", "Be open and transparent with the audience", "Minimize surprise for those affected"], 1, "Reach affected audiences through multiple channels, including social media, and be open and transparent."], ["Which should you AVOID in the close of a routine request?", ["A specific deadline for the reply", "Thanking the reader 'in advance'", "Contact information for follow-up", "A friendly line of goodwill"], 1, "Many people find thanking in advance presumptuous. Thank them after you get the reply."], ["In which situation could using the indirect approach be illegal?", ["An emergency, when people must be warned right away", "A negative performance review for one long-time employee", "A refusal of a customer's routine claim for a refund", "A rejection letter sent to an unsuccessful job applicant"], 0, "In an emergency, such as a toxic spill, delaying the main point behind a buffer can be illegal. Use the direct approach to warn people immediately."], ["When granting a customer's claim, which should you AVOID?", ["Sympathizing with the customer", "Explaining how you'll fix the problem", "Acknowledging the complaint", "Blaming a colleague by name"], 3, "Steps: acknowledge, sympathize, take responsibility, explain, repair the relationship, follow up. Don't blame colleagues by name, over-apologize, imply the customer is at fault, or overpromise."], ["You receive an unsolicited proposal from an external sender you have no relationship with. What does the text say?", ["You must always respond in writing", "You may not need to respond", "You must send a legal notice", "You must accept it"], 1, "If you solicited the proposal, you owe the sender an explanation, and the direct approach is better."], ["Which statement about AIDA is TRUE?", ["It was designed for casual social media conversations", "It works best with the direct approach only, never indirect", "It suits the indirect approach because the request comes last", "It has no limitations when used for long messages"], 2, "AIDA is tailor-made for the indirect approach. Its limitations: it talks at audiences and focuses on single events, not long-term relationships."], ["Which is a feature of a POOR buffer?", ["It is relevant to the situation at hand", "It is sincere and genuine in tone", "It establishes common ground with the reader", "It misleads the reader into expecting good news"], 3, "A poor buffer might trivialize concerns, flatter insincerely, or mislead the reader."], ["Which is an example of a training application of augmented reality?", ["Technicians see repair steps overlaid on the actual equipment", "Trainees read a printed manual about the equipment", "Employees watch a recorded lecture on the company intranet", "A manager emails a checklist before the repair begins"], 0, "Augmented reality overlays information on live camera images, so trainees can see steps on the real equipment. Your notes list training applications and gamification."]]}]}]};

        var b = state.best[e.id + '-' + si];
        h += '<button class="setrow" data-act="set" data-e="' + ei + '" data-s="' + si + '"><span class="tx"><span class="nm">' + esc(s.name) + '</span><span class="ds">' + esc(s.desc) + '</span></span>';
        h += '<span class="rt"><span class="ct">' + s.qs.length + ' Q</span>' + (b ? '<br><span class="best">Best ' + b + '/' + s.qs.length + '</span>' : '') + '</span></button>';
      });
      h += '</section>';
    });
    h += '<p class="note">Questions come from the course study guides and slides. Where your professor words something differently, go with your notes and slides. Each exam is practice only.</p>';
    return h;
  }

  function quizView() {
    var r = state.run, q = r.qs[r.i], pk = r.picked, answered = pk !== null;
    var h = '<div class="top"><button class="btn" data-act="home" aria-label="Back to exams">← Exams</button><div class="ttl">' + esc(r.title) + '</div><div class="cnt">' + (r.i + 1) + ' / ' + r.total + '</div></div>';
    h += '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="' + r.total + '" aria-valuenow="' + (r.i + (answered ? 1 : 0)) + '"><i style="width:' + (((r.i + (answered ? 1 : 0)) / r.total) * 100) + '%"></i></div>';
    h += '<div class="qcard"><div class="qmeta"><span class="mono">Question ' + String(r.i + 1).padStart(2, '0') + '</span><span class="mono">' + esc(q.src) + '</span></div>';
    h += '<p class="q" id="qtext" tabindex="-1">' + esc(q.q) + '</p><div class="opts" role="group" aria-labelledby="qtext">';
    q.opts.forEach(function (t, k) {
      var cls = 'opt';
      if (answered) { if (k === q.ci) cls += ' ok'; else if (k === pk) cls += ' no'; else cls += ' dim'; }
      h += '<button class="' + cls + '" data-act="pick" data-k="' + k + '"' + (answered ? ' disabled' : '') + '><span class="l">' + LET[k] + '</span><span>' + esc(t) + '</span></button>';
    });
    h += '</div>';
    if (answered) {
      var ok = pk === q.ci;
      h += '<div class="fb ' + (ok ? 'ok' : 'no') + '" role="status"><span class="stamp pop">' + (ok ? 'Approved' : 'Revise') + '</span>';
      h += '<div class="v">' + (ok ? 'Correct.' : 'Not quite.') + '</div>';
      if (!ok) h += '<div class="ans"><b>Answer:</b> ' + esc(q.opts[q.ci]) + '</div>';
      h += '<div class="ex"><b>Why</b>' + esc(q.ex) + '</div></div>';
      h += '<button class="btn primary block next" id="nextbtn" data-act="next">' + (r.i + 1 >= r.total ? 'See results' : 'Next question') + '</button>';
    }
    h += '</div>';
    h += '<p class="keys">Keys: 1–4 or A–D to answer, Enter for next</p>';
    return h;
  }

  function resultsView() {
    var r = state.run, pct = Math.round((r.score / r.total) * 100);
    var tier = pct >= 80 ? ['Approved', 'good'] : pct >= 60 ? ['Revise and resubmit', 'mid'] : ['Return to sender', 'low'];
    var h = '<div class="top"><button class="btn" data-act="home">← Exams</button><div class="ttl">' + esc(r.title) + '</div></div>';
    h += '<section class="score"><div class="mono">Final score</div><div class="big">' + r.score + '/' + r.total + '</div><div class="pct">' + pct + '%</div><span class="stamp ' + tier[1] + '">' + tier[0] + '</span></section>';
    h += '<div class="actions">';
    if (r.missed.length) h += '<button class="btn primary block" data-act="retry">Retake the ' + r.missed.length + ' you missed</button>';
    h += '<button class="btn block" data-act="again">' + 'Retake all' + '</button>';
    h += '<button class="btn block" data-act="home">Back to all exams</button></div>';
    if (r.missed.length) {
      h += '<section class="missed"><h2>Review what you missed</h2>';
      r.missed.forEach(function (m) {
        h += '<div class="mi"><span class="mono">' + esc(m.src) + '</span><div class="mq">' + esc(m.q) + '</div>';
        h += '<div class="your">Your answer: ' + esc(m.opts[m.pick]) + '</div><div class="right">Correct: ' + esc(m.opts[m.ci]) + '</div><div class="why">' + esc(m.ex) + '</div></div>';
      });
      h += '</section>';
    } else {
      h += '<p class="note">No misses. Nice work.</p>';
    }
    return h;
  }

  function render(focusQ) {
    app.innerHTML = state.view === 'home' ? homeView() : state.view === 'quiz' ? quizView() : resultsView();
    if (focusQ === true) { window.scrollTo(0, 0); var el = document.getElementById('qtext'); if (el) el.focus({ preventScroll: true }); }
    else if (focusQ === 'top') { window.scrollTo(0, 0); }
  }

  function pick(k) {
    var r = state.run; if (r.picked !== null) return;
    var q = r.qs[r.i]; r.picked = k;
    if (k === q.ci) r.score++;
    else r.missed.push({ q: q.q, opts: q.opts, ci: q.ci, pick: k, ex: q.ex, src: q.src });
    render();
    var nb = document.getElementById('nextbtn'); if (nb) { nb.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); nb.focus({ preventScroll: true }); }
  }
  function next() {
    var r = state.run; if (r.picked === null) return;
    if (r.i + 1 >= r.total) {
      if (r.key) {
        var prev = state.best[r.key] || 0;
        if (r.score > prev) { state.best[r.key] = r.score; save(); }
      }
      state.view = 'results'; render('top'); return;
    }
    r.i++; r.picked = null; render(true);
  }

  app.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-act]'); if (!t) return;
    var a = t.getAttribute('data-act');
    if (a === 'set') startSet(+t.getAttribute('data-e'), +t.getAttribute('data-s'));
    else if (a === 'shuf') { state.shuffleQ = !state.shuffleQ; save(); render(); }
    else if (a === 'pick') pick(+t.getAttribute('data-k'));
    else if (a === 'next') next();
    else if (a === 'home') { state.view = 'home'; render('top'); }
    else if (a === 'retry') retryMissed();
    else if (a === 'again') restart();
  });
  document.addEventListener('keydown', function (ev) {
    if (state.view !== 'quiz' || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var r = state.run, k = ev.key;
    if (r.picked === null) {
      var n = '1234'.indexOf(k); if (n < 0) n = 'abcd'.indexOf(k.toLowerCase());
      if (n >= 0 && k.length === 1) { ev.preventDefault(); pick(n); }
    } else if (k === 'Enter' && document.activeElement && document.activeElement.id !== 'nextbtn') {
      ev.preventDefault(); next();
    }
  });

  load();
  render();
})();
</script>

</body></html>
