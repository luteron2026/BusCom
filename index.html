<body>
<style>
/* Concept: an interoffice memo. Mono field labels and a ruled letterhead for structure, teal ink for action, and rubber stamps (APPROVED / REVISE) for feedback. */
:root{
  --bg:#e6ebe8; --paper:#fafbfa; --ink:#14211c; --muted:#56655f; --line:#c9d3ce; --line-strong:#14211c;
  --accent:#0b5d4b; --accent-ink:#ffffff; --accent-soft:#d9eae4;
  --good:#0b6b4a; --good-bg:#dcf0e6; --bad:#b3261e; --bad-bg:#fae6e2; --stamp:#c0341d;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --serif:"Literata",Georgia,"Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1411; --paper:#141e1a; --ink:#e7efea; --muted:#9db0a7; --line:#2b3b35; --line-strong:#e7efea;
    --accent:#5fd1b1; --accent-ink:#06201a; --accent-soft:#1a3029;
    --good:#74d9a8; --good-bg:#14301f; --bad:#ff9a8f; --bad-bg:#3a1f1c; --stamp:#ff8f7a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1411; --paper:#141e1a; --ink:#e7efea; --muted:#9db0a7; --line:#2b3b35; --line-strong:#e7efea;
  --accent:#5fd1b1; --accent-ink:#06201a; --accent-soft:#1a3029;
  --good:#74d9a8; --good-bg:#14301f; --bad:#ff9a8f; --bad-bg:#3a1f1c; --stamp:#ff8f7a;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:1rem;line-height:1.55;
  padding-block:22px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{max-width:640px;margin:0 auto}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-size:.7188rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500}

/* letterhead */
.head{padding-bottom:16px;border-bottom:3px solid var(--line-strong)}
.head .mono{display:flex;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:800;font-stretch:118%;font-size:clamp(2.1rem,10.5vw,3.25rem);line-height:.98;letter-spacing:-.02em;margin-top:0;text-wrap:balance}
.memo{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin-top:18px;font-size:.9375rem}
.memo dt{font-family:var(--mono);font-size:.7188rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-top:.28rem}
.memo dd{margin:0;min-width:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 20px;border-radius:6px;border:2px solid var(--line-strong);background:var(--paper);font-family:var(--display);font-weight:700;font-size:1rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.block{display:flex;width:100%}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:default}

/* home */
.tg{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin-top:14px;padding:12px 14px;min-height:58px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper)}
.tg b{font-family:var(--display);font-weight:700}
.tg small{display:block;color:var(--muted);font-size:.8125rem;line-height:1.35}
.tg .sw{flex:none;margin-left:auto;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .15s}
.tg .sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--paper);box-shadow:0 0 0 1px rgba(0,0,0,.15);transition:transform .15s}
.tg[aria-checked="true"] .sw{background:var(--accent)}
.tg[aria-checked="true"] .sw::after{transform:translateX(18px)}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:30px 0 4px;padding-bottom:6px;border-bottom:1.5px solid var(--line)}
.exam{margin-top:12px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper);overflow:hidden}
.exam header{padding:16px 16px 12px}
.exam h3{font-family:var(--display);font-weight:800;font-stretch:112%;font-size:1.5rem;line-height:1.1;margin-top:4px;letter-spacing:-.01em}
.exam .sub{font-family:var(--display);font-weight:600;margin-top:2px;font-size:.9375rem}
.exam .tp{margin-top:8px;font-size:.875rem;color:var(--muted);max-width:52ch}
.setrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;min-height:64px;padding:12px 16px;border:0;border-top:1.5px solid var(--line);background:transparent}
.setrow:hover{background:var(--accent-soft)}
.setrow .nm{font-family:var(--display);font-weight:700;font-size:1.0625rem;line-height:1.2}
.setrow .ds{display:block;color:var(--muted);font-size:.8125rem;line-height:1.35;margin-top:1px}
.setrow .tx{min-width:0;flex:1}
.setrow .rt{flex:none;text-align:right}
.setrow .ct{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.best{display:inline-block;margin-top:3px;padding:1px 8px;border-radius:4px;font-family:var(--mono);font-size:.75rem;font-weight:500;background:var(--good-bg);color:var(--good)}
.soon{position:relative;margin-top:12px;padding:16px;border:1.5px dashed var(--line);border-radius:8px;background:transparent}
.soon h3{font-family:var(--display);font-weight:800;font-stretch:112%;font-size:1.5rem;line-height:1.1;margin-right:130px;color:var(--muted);letter-spacing:-.01em}
.soon p{margin-top:8px;font-size:.875rem;color:var(--muted)}
.stamp{display:inline-block;padding:3px 10px 2px;border:2.5px solid currentColor;border-radius:4px;font-family:var(--display);font-weight:800;font-stretch:112%;font-size:.9375rem;letter-spacing:.1em;text-transform:uppercase;line-height:1.2;transform:rotate(-5deg);outline:1.5px solid currentColor;outline-offset:2px}
.soon .stamp{position:absolute;top:16px;right:20px;color:var(--stamp);opacity:.9}
.note{margin-top:28px;padding-left:12px;border-left:2px solid var(--line);font-size:.8438rem;line-height:1.55;color:var(--muted);max-width:60ch}

/* quiz */
.top{display:flex;align-items:center;gap:12px}
.top .btn{min-height:44px;padding:6px 14px;font-size:.9375rem}
.top .ttl{min-width:0;flex:1;font-family:var(--display);font-weight:700;font-size:1rem;line-height:1.2}
.top .cnt{flex:none;font-family:var(--mono);font-size:.875rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.bar{height:8px;margin:14px 0 16px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.qcard{background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:16px 16px 18px}
.qmeta{display:flex;justify-content:space-between;gap:10px;padding-bottom:10px;margin-bottom:14px;border-bottom:1.5px dashed var(--line)}
.q{font-size:1.1875rem;line-height:1.5;font-weight:600;margin-bottom:16px;outline:none}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;min-height:52px;padding:12px 14px;border-radius:6px;border:1.5px solid var(--line);background:var(--bg);font-size:1rem;line-height:1.45}
.opt:not([disabled]):hover{border-color:var(--line-strong)}
.opt .l{flex:none;width:28px;height:28px;border-radius:4px;border:1.5px solid var(--line-strong);font-family:var(--mono);font-size:.8125rem;font-weight:500;display:flex;align-items:center;justify-content:center;margin-top:-2px}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.ok .l{border-color:var(--good);background:var(--good);color:var(--paper)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.no .l{border-color:var(--bad);background:var(--bad);color:var(--paper)}
.opt[disabled]{cursor:default;color:var(--ink)}
.opt.dim{opacity:.62}
.fb{position:relative;margin-top:18px;padding:14px 14px 14px;border-radius:6px;border:1.5px solid var(--line)}
.fb.ok{background:var(--good-bg);border-color:var(--good)}
.fb.no{background:var(--bad-bg);border-color:var(--bad)}
.fb .stamp{position:absolute;top:-16px;right:12px;background:var(--paper)}
.fb.ok .stamp{color:var(--good)}
.fb.no .stamp{color:var(--bad)}
.fb .v{font-family:var(--display);font-weight:700;font-size:1.0625rem;padding-right:120px}
.fb .ans{margin-top:6px;font-size:.9375rem}
.fb .ex{margin-top:8px;font-size:.9375rem;color:var(--ink)}
.fb .ex b{font-family:var(--mono);font-size:.7188rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-right:6px}
.next{margin-top:16px}
.keys{margin-top:18px;text-align:center;font-family:var(--mono);font-size:.7188rem;letter-spacing:.06em;color:var(--muted)}
@media (pointer:coarse){.keys{display:none}}
.pop{animation:pop .22s ease-out}
@keyframes pop{from{transform:rotate(-5deg) scale(1.35);opacity:0}to{transform:rotate(-5deg) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.pop{animation:none}.bar i,.tg .sw,.tg .sw::after{transition:none}}

/* results */
.score{margin-top:18px;padding:22px 16px 24px;border:1.5px solid var(--line-strong);border-radius:8px;background:var(--paper);text-align:center}
.score .big{font-family:var(--display);font-weight:800;font-stretch:118%;font-size:4.25rem;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:12px}
.score .pct{margin-top:6px;font-family:var(--mono);font-size:.9375rem;color:var(--muted)}
.score .stamp{margin-top:18px;font-size:1.0625rem}
.score .stamp.good{color:var(--good)}
.score .stamp.mid{color:var(--accent)}
.score .stamp.low{color:var(--bad)}
.actions{display:grid;gap:10px;margin-top:16px}
.missed{margin-top:26px}
.missed h2{font-family:var(--display);font-weight:800;font-stretch:112%;font-size:1.25rem;line-height:1.15}
.mi{margin-top:10px;padding:14px;border:1.5px solid var(--line);border-radius:8px;background:var(--paper)}
.mi .mq{font-weight:600;font-size:1rem}
.mi .your{margin-top:8px;font-size:.9063rem;color:var(--bad)}
.mi .right{margin-top:4px;font-size:.9063rem;color:var(--good);font-weight:600}
.mi .why{margin-top:6px;font-size:.875rem;color:var(--muted)}
.mi .mono{display:block;margin-bottom:6px}
</style>
